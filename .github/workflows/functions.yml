name: Deploy Firebase Functions
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/functions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --prefix functions --omit=dev --no-audit --no-fund
      - name: Deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::GitHub 비밀 설정에 FIREBASE_SERVICE_ACCOUNT 가 없어요"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx -y firebase-tools@latest deploy --only functions --project hanbit-schedule --non-interactive --force
          code=$?
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $code -ne 0 ] && [ -f firebase-debug.log ]; then
            echo "----- 실패 원인 (firebase-debug.log 요약) -----"
            grep -E '"message"|"status"|HTTP Error|Error:' firebase-debug.log | grep -viE 'token|authorization|private_key|bearer' | tail -40
          fi
          exit $code
