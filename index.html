#splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:grid;place-items:center;transition:opacity .25s ease}
#splash img{width:min(72vw,340px);height:auto;max-width:100%}
#splash .ver{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font:600 12px/1 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:#5D6878;letter-spacing:.02em}
#splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}

<style>
/* Layout: mobile app shell — sticky view header, content, fixed bottom tab bar; from 960px the tab bar becomes a left sidebar and views split into columns; sheets slide up on phones, center as dialogs on wide screens */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --sunken:#F7F9FB; --line:#D6DCE5; --line-soft:#E3E8EF;
  --fg:#16202E; --fg-2:#3B4656; --muted:#5D6878; --faint:#8A94A3;
  --accent:#1C4ED8; --accent-fg:#FFFFFF; --accent-soft:#E8EEFC;
  --sun:#D33A2C; --sat:#2563EB; --ok:#178A57; --warn:#9A6414; --danger:#B3261E;
  --c-sf:#1F4FCF; --c-hx:#D9461F; --c-db:#0E8A5F; --c-on:#7B3FC4; --c-etc:#5F6B7A;
  --coffee:#9A3412; --coffee-fg:#FFFFFF;
  --scrim:rgb(10 15 25 / .45); --shadow:0 10px 30px rgb(15 25 45 / .14);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --nav-h:64px; --side-w:232px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#171E29; --surface-2:#222C3B; --sunken:#121821; --line:#2C3747; --line-soft:#242E3C;
  --fg:#E6EBF2; --fg-2:#C3CCD8; --muted:#97A3B5; --faint:#6F7B8D;
  --accent:#7097FF; --accent-fg:#0B1220; --accent-soft:#1D2A47;
  --sun:#FF7A6B; --sat:#7DA4FF; --ok:#4CC58C; --warn:#E5B04F; --danger:#FF8A80;
  --c-sf:#7097FF; --c-hx:#FF8A63; --c-db:#43C793; --c-on:#B88BF5; --c-etc:#9AA6B6;
  --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171E29; --surface-2:#222C3B; --sunken:#121821; --line:#2C3747; --line-soft:#242E3C;
  --fg:#E6EBF2; --fg-2:#C3CCD8; --muted:#97A3B5; --faint:#6F7B8D;
  --accent:#7097FF; --accent-fg:#0B1220; --accent-soft:#1D2A47;
  --sun:#FF7A6B; --sat:#7DA4FF; --ok:#4CC58C; --warn:#E5B04F; --danger:#FF8A80;
  --c-sf:#7097FF; --c-hx:#FF8A63; --c-db:#43C793; --c-on:#B88BF5; --c-etc:#9AA6B6;
  --scrim:rgb(0 0 0 / .6); --shadow:0 10px 30px rgb(0 0 0 / .5); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.c-sf{--c:var(--c-sf)} .c-hx{--c:var(--c-hx)} .c-db{--c:var(--c-db)} .c-on{--c:var(--c-on)} .c-etc{--c:var(--c-etc)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));min-height:100%}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.nav .brand{display:none}
.nav button{height:56px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;border-radius:10px;min-width:0}
.nav button span{white-space:nowrap}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav button svg.i{width:24px;height:24px}

.vh{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 8px;flex-wrap:wrap}
.vh .grow{margin-right:auto;min-width:0;display:flex;flex-direction:column}
.vh h1{font-size:20px;font-weight:700;line-height:1.25}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;text-transform:uppercase}
.vh .date{font-size:13.5px;color:var(--muted);font-weight:500}

@media (min-width:960px){
  .nav{top:0;right:auto;width:var(--side-w);border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;
    padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px calc(12px + env(safe-area-inset-left,0px))}
  .nav .brand{display:flex;flex-direction:column;padding:0 10px 18px}
  .nav .brand b{font-size:16px}
  .nav button{height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;font-size:14.5px}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  .nav button svg.i{width:22px;height:22px}
  .main{margin-left:var(--side-w);padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px));padding-bottom:48px}
  .vh{padding-block:22px 10px}
  .vh h1{font-size:24px}
}

/* ---------- common parts ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:700;margin-right:auto}
.sec-h{display:flex;align-items:center;gap:8px;padding:2px 2px 0}
.sec-h h2{font-size:14.5px;font-weight:700;margin-right:auto}
.sec-h h2 span{font-weight:500;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.sm{height:38px;padding:0 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--fg)}
.ib.flat{border-color:transparent;background:transparent}
.ib:hover{background:var(--surface-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:3px;border-radius:12px;background:var(--surface-2)}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;min-width:0;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgb(15 25 45 / .15)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.chip select{border:0;background:transparent;font-weight:600;font-size:13px;color:inherit;max-width:8em}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px 14px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface)}
.notice{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));font-size:13px;max-width:1180px;margin-inline:auto}
.st{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.st.ing{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.st.done{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.eq{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));color:var(--c,var(--accent))}
.cname{font-weight:700;color:var(--c)}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* event rows */
.evs{display:flex;flex-direction:column;gap:8px}
.pchip{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 8px;border-radius:5px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--pc,#5F6B7A);color:var(--pt,#FFFFFF);flex:none}
.ev-row .pchip{height:28px;min-width:60px;font-size:13.5px;border-radius:7px}
.pgrp{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.pgrp.has-more>:first-child{padding-right:62px}
.morep{position:absolute;top:8px;right:8px;min-width:44px;height:30px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-size:13px;font-weight:700}
.morep[aria-expanded="true"]{color:var(--muted)}
.ev-row.sub,.pitem.sub{margin-left:14px;width:calc(100% - 14px)}
.ev-row{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:1px solid var(--line-soft);border-radius:12px;background:var(--sunken);text-align:left;width:100%;min-width:0}
button.ev-row:hover{border-color:var(--line)}
.ev-row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev-row .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev-row .l1 b{font-size:15.5px}
.ev-row .l2{display:flex;align-items:center;gap:5px;font-size:13.5px;flex-wrap:wrap}
.ev-row .l2 svg.i{width:14px;height:14px;color:var(--faint)}
.ev-row .l3{display:flex;gap:5px;flex-wrap:wrap}
.ev-row .memo{font-size:12.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.ev-row.done{opacity:.65}
.ev-bar{width:5px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}

/* today */
.today-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.today-grid > div{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:960px){.today-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.next{padding-top:10px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.next b{color:var(--fg);font-weight:600}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qt{min-height:78px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 2px;color:var(--fg);font-size:12px;font-weight:600;text-align:center;min-width:0}
.qt svg.i{width:24px;height:24px;color:var(--fg-2)}
.qt.hl{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.qt.hl svg.i{color:var(--accent)}
.qt:hover{border-color:var(--fg-2)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.wd{height:66px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.wd small{font-size:11px;font-weight:600;color:var(--muted)}
.wd b{font-size:15.5px;font-variant-numeric:tabular-nums}
.wd.sun small,.wd.sun b{color:var(--sun)} .wd.sat small,.wd.sat b{color:var(--sat)}
.wd.today{background:var(--accent)} .wd.today small,.wd.today b{color:var(--accent-fg)}
.wd:hover{background:var(--surface-2)} .wd.today:hover{background:var(--accent)}
.dots{display:flex;gap:3px;height:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--c))}
.wd.today .dots i{box-shadow:0 0 0 1.5px var(--accent-fg)}

/* calendar */
.mnav{display:flex;align-items:center;gap:4px}
.mnav h1{min-width:7.2em;text-align:center;font-variant-numeric:tabular-nums}
.pfs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pfs::-webkit-scrollbar{display:none}
.pf{flex:none;height:36px;padding:0 12px;border-radius:999px;border:2px solid var(--pc);background:var(--pc);color:var(--pt);font-size:13px;font-weight:700}
.pf.all{--pc:var(--surface);--pt:var(--fg);border-color:var(--line)}
.pf.all[aria-pressed="true"]{--pc:var(--fg);--pt:var(--bg);border-color:var(--fg)}
.pf.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.pf.dim{opacity:.35}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:pan-y}
.dow,.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.dow div{padding:7px 0;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line-soft)}
.cell{min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:var(--surface)}
.cell.c5{border-right:0}
.cell.out{background:var(--sunken)} .cell.out .dn{opacity:.4}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.hit{flex:1;min-height:112px;border:0;background:transparent;padding:4px 3px 5px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;color:inherit}
.hit:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.dhead{display:flex;align-items:center;justify-content:center;gap:6px}
.dn{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.today .dn{background:var(--accent);color:var(--accent-fg)}
.dcount,.addp{display:none}
.plist{display:flex;flex-direction:column;gap:10px}
.plist:empty{display:none}
.pbox{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pbox .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hint[aria-pressed="true"]{border-style:solid;border-color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));color:var(--fg)}
.mdots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:3px 2px 2px}
.mdots i{width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12)}
.pitems{display:none}
@media (min-width:760px){
  .hit{flex:none;min-height:0;padding:6px 8px 4px}
  .dhead{justify-content:flex-start}
  .dn{font-weight:700}
  .dcount{display:inline;font-size:12px;color:var(--muted)}
  .addp{display:grid;margin-left:auto;width:28px;height:28px;border-radius:7px;place-items:center;color:var(--muted)}
  .hit:hover .addp{background:var(--surface-2);color:var(--accent)}
  .mdots{display:none}
  .cell{min-height:150px}
  .pitems{display:flex;flex-direction:column;gap:5px;padding:0 6px 8px}
  .pitem{display:flex;flex-direction:column;gap:2px;padding:5px 6px;border-radius:7px;background:var(--sunken);border:1px solid transparent;text-align:left;min-width:0;width:100%;color:inherit}
  button.pitem:hover{border-color:var(--line)}
  .pitem .r1{display:flex;align-items:center;gap:6px;min-width:0}
  .pitem .pl{font-size:12.5px;font-weight:700;min-width:0;overflow-wrap:anywhere}
  .pitem .r2{font-size:12px;color:var(--fg-2);overflow-wrap:anywhere}
  .pitem .eqs{font-family:var(--mono);font-size:11.5px;font-weight:600}
  .pitem .pchip{height:20px;font-size:12px;padding:0 7px}
  .pitems .pgrp{gap:4px}
  .pitems .pgrp.has-more>:first-child{padding-right:40px}
  .pitems .morep{top:4px;right:4px;min-width:32px;height:22px;padding:0 6px;font-size:11.5px}
}
.daypanel{display:flex;flex-direction:column;gap:10px}
@media (min-width:760px){.daypanel{display:none}}
.dp-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dp-h h2{font-size:17px;font-weight:700}
.dp-h .grow{margin-right:auto;display:flex;align-items:baseline;gap:8px}
.calnote{font-size:12.5px;color:var(--muted)}
.pick.pp[aria-pressed="true"]{background:var(--pc);color:var(--pt);border:1.5px solid var(--pc)}

<script>
/* 휴대폰·태블릿 표시 (아웃룩 .eml 버튼은 창 크기와 상관없이 PC에서만) */
try{if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent)))document.documentElement.classList.add('phone')}catch(e){}
(function(){

  var nav=null;try{nav=performance.getEntriesByType('navigation')[0]}catch(e){}
  var reload=(nav&&nav.type==='reload')||(performance.navigation&&performance.navigation.type===1);
  var seen=false;try{seen=sessionStorage.getItem('hj.splash')==='1';sessionStorage.setItem('hj.splash','1')}catch(e){}
  if(reload||seen){var s0=document.getElementById('splash');if(s0)s0.remove();return}
  var t0=(window.performance&&performance.now)?performance.now():0;
  /* 페이지가 열린 뒤 약 2초 보여 주고 사라짐 */
  setTimeout(function(){var el=document.getElementById('splash');if(!el)return;el.classList.add('out');setTimeout(function(){el.remove()},300)},Math.max(0,2000-t0));
})();

  return src.filter(p=>p[0]).map((p,i)=>({name:p[0],rank:p[1]||'',c:PALETTE[i]||OTHER_C}));
}
function rankOf(n){const i=staff().findIndex(p=>p.name===n);return i<0?99:i}
function colorOf(n){const p=staff().find(x=>x.name===n);return p?p.c:OTHER_C}
const pst=n=>{const c=colorOf(n);return `--pc:${c[0]};--pt:${c[1]}`};
function people(){
  const set=new Set(staff().map(p=>p.name));
  S.events.forEach(e=>splitP(e.person).forEach(p=>set.add(p)));
  return [...set].sort((a,b)=>(rankOf(a)-rankOf(b))||a.localeCompare(b,'ko'));
}
function visible(e){
  if(S.fPerson!=='전체'&&!splitP(e.person).includes(S.fPerson))return false;
  return true;
}
/* one entry per person per event, rank order */

/* 날짜 미정 (그 주 안에): tbd:true, start=그 주 월요일, end=금요일. 날짜 칸에는 안 나오고 주 띠로 표시 */
const isTbd=e=>!!e&&e.tbd===true;
function tbdWeek(mon,all){
  const out=[];
  S.events.forEach(e=>{if(!isTbd(e)||e.start!==mon)return;splitP(e.person).forEach(p=>{if(all||S.fPerson==='전체'||S.fPerson===p)out.push({e,p})})});
  return out.sort((a,b)=>(rankOf(a.p)-rankOf(b.p))||a.p.localeCompare(b.p,'ko'));
}
const monOf=s=>ymd(weekMon(parse(s)));
function tbdBand(mon){
  const ents=tbdWeek(mon);if(!ents.length)return '';
  const tag=S.readOnly?'div':'button';
  return `<div class="tbdband" role="group" aria-label="이 주 날짜 미정 일정"><span class="tbd-l">날짜 미정</span>${ents.map(x=>{const e=x.e;
    return `<${tag} ${tag==='button'?`type="button" data-act="edit-ev" data-id="${esc(e.id)}"`:''} class="tbd-i"><span class="pchip" style="${pst(x.p)}">${esc(x.p)}</span><span class="tbd-t">${esc(placeOf(e))}${e.work?' · '+esc(e.work):''}</span></${tag}>`}).join('')}</div>`;
}
function tbdSection(mon,title){
  const ents=tbdWeek(mon,true);if(!ents.length)return '';
  return `<div class="tbd-sec"><div class="sec-h"><h2>${title} <span>${ents.length}건</span></h2></div><div class="evs">${ents.map(x=>entRow(x,{memo:true,cls:'tbd'})).join('')}</div></div>`;
}
function entriesOn(day,all){
  const out=[];
  {const wd=parse(day).getDay();if(wd===0||wd===6)return out;} /* 주말은 근무하지 않음: 여러 날 일정도 토·일은 비움 */
  S.events.forEach(e=>{if(isTbd(e)||!onDay(e,day))return;splitP(e.person).forEach(p=>{if(all||S.fPerson==='전체'||S.fPerson===p)out.push({e,p})})});
  return out.sort((a,b)=>(rankOf(a.p)-rankOf(b.p))||a.p.localeCompare(b.p,'ko'));
}
function sitesOf(key){
  const c=custOf(key);const doc=S.customers[c.cls]||{};
  const list=[...c.sites];
  Object.keys(doc.sites||{}).forEach(s=>{if(!list.includes(s))list.push(s)});
  return list;
}
function gateCount(key){
  const c=custOf(key);const doc=S.customers[c.cls]||{};
  return Object.values(doc.sites||{}).reduce((n,s)=>n+((s&&s.gates)||[]).length,0);
}

/* ---------- small renderers ---------- */
const stCls=s=>s==='완료'?'done':s==='진행중'?'ing':'';
/* 한 일정에 방문지 여러 곳: places[{customer,customerName,site}] (예전 일정은 customer/site 하나) */
const placesOf=e=>Array.isArray(e.places)&&e.places.length?e.places:(e.customer?[{customer:e.customer,customerName:e.customerName||'',site:e.site||''}]:[]);
const pName=p=>p.customer==='기타'?(p.customerName||'기타'):p.customer;
/* 연차·반차: kind:'leave', leaveType '연차'|'오전 반차'|'오후 반차' */
const isLeave=e=>!!e&&e.kind==='leave';
const leaveOf=e=>e.leaveType||'연차';
const tripN=ents=>uniqP(ents.filter(x=>!isLeave(x.e))).length;
const placeOf=e=>isLeave(e)?leaveOf(e):placesOf(e).map(p=>[pName(p),p.site].filter(Boolean).join(' ')).join(' · ');
const uniqP=ents=>{const seen=new Set();return ents.filter(x=>!seen.has(x.p)&&seen.add(x.p))};
/* 같은 날 같은 사람의 일정은 한 줄만 보이고 '+n'을 누르면 나머지가 펼쳐짐 */
function grpRows(day,ents,one){
  const m=new Map();ents.forEach(x=>{if(!m.has(x.p))m.set(x.p,[]);m.get(x.p).push(x)});
  return [...m.values()].map(xs=>{
    const key=day+'|'+xs[0].p,more=xs.length-1,open=more&&OPENP.has(key);
    return `<div class="pgrp${more?' has-more':''}">${one(xs[0],'')}${more?`<button type="button" class="morep" data-act="more-p" data-k="${esc(key)}" aria-expanded="${open}" aria-label="${open?'접기':esc(xs[0].p)+'의 같은 날 일정 '+more+'개 더 보기'}">${open?'접기':'+'+more}</button>`:''}${open?xs.slice(1).map(x=>one(x,'sub')).join(''):''}</div>`;
  }).join('');
}
function entRow(x,opts){
  const e=x.e;const xc=opts&&opts.cls?' '+opts.cls:'';
  const range=isTbd(e)?`${fmtShort(e.start)} 주 · 날짜 미정`:(e.end&&e.end!==e.start)?`${fmtShort(e.start)} – ${fmtShort(e.end)}`:'';
  const tag=S.readOnly?'div':'button';
  const eq=(e.equipment||[]).concat((e.units||[]).filter(u=>u.h).map(u=>u.h+(u.w?' · '+u.w:'')+(opts&&opts.memo&&u.n?' ('+u.n+')':'')));
  return `<${tag} ${tag==='button'?'type="button" data-act="edit-ev" data-id="'+esc(e.id)+'"':''} class="ev-row${xc}${isLeave(e)?' leave':''}">
    <span class="pchip" style="${pst(x.p)}">${esc(x.p)}</span>
    <span class="body">
      <span class="l1"><b>${esc(placeOf(e))}</b>${range?`<span class="small muted mono">${range}</span>`:''}</span>
      ${e.work?`<span class="small" style="color:var(--fg-2)">${esc(e.work)}</span>`:''}
      ${eq.length?`<span class="l3">${eq.map(q=>`<span class="eq">${esc(q)}</span>`).join('')}</span>`:''}
      ${opts&&opts.memo&&e.memo?`<span class="memo">${esc(e.memo)}</span>`:''}
    </span>
  </${tag}>`;
}
/* weeks of Mon–Fri covering the month */
function monthWeeks(y,m){
  const first=new Date(y,m,1),wd=first.getDay();
  let s=new Date(y,m,1+(wd===0?1:wd===6?2:1-wd));
  const last=new Date(y,m+1,0),weeks=[];
  while(s<=last){const row=[];for(let i=0;i<5;i++)row.push(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));weeks.push(row);s=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)}
  return weeks;
}

function vCal(){
  const t=todayStr();
  const weeks=monthWeeks(S.y,S.m);
  let cells='';
  weeks.forEach(row=>{
    cells+=tbdBand(ymd(row[0]));
    row.forEach((d,i)=>{
      const k=ymd(d);const ents=entriesOn(k);
      const cls=['cell'];if(i===4)cls.push('c5');
      if(d.getMonth()!==S.m)cls.push('out');
      if(k===t)cls.push('today');if(k===S.sel&&!isWide())cls.push('sel');
      const pi=grpRows(k,ents,(x,c)=>{const e=x.e;const eq=(e.equipment||[]).join(', ');const tag=S.readOnly?'div':'button';
        return `<${tag} ${tag==='button'?`type="button" data-act="edit-ev" data-id="${esc(e.id)}"`:''} class="pitem${c?' '+c:''}${isLeave(e)?' leave':''}">
          <span class="r1"><span class="pchip" style="${pst(x.p)}">${esc(x.p)}</span><span class="pl">${esc(placeOf(e))}</span></span>
          ${eq||e.work?`<span class="r2">${eq?`<span class="eqs">${esc(eq)}</span>`:''}${eq&&e.work?' · ':''}${esc(e.work||'')}</span>`:''}
        </${tag}>`});
      cells+=`<div class="${cls.join(' ')}">
        <button type="button" class="hit" data-act="pick-day" data-d="${k}" aria-label="${fmtDay(k)} 출장 ${tripN(ents)}명${S.readOnly?'':', 눌러서 일정 추가'}">
          <span class="dhead"><span class="dn">${d.getDate()}</span><span class="dcount">${tripN(ents)?tripN(ents)+'명':''}</span>${S.readOnly?'':`<span class="addp" aria-hidden="true">${ic('plus',16)}</span>`}</span>
          ${ents.length?`<span class="mdots" aria-hidden="true">${uniqP(ents).map(x=>`<i class="${isLeave(x.e)?'lv':''}" style="${pst(x.p)}"></i>`).join('')}</span>`:''}
        </button>
        ${pi?`<div class="pitems">${pi}</div>`:''}

    panel=`<div class="dp-h"><div class="grow"><h2>${fmtDay(S.sel)}</h2><span class="small muted">${[tripN(ents)||!ents.length?`출장 ${tripN(ents)}명`:'',ents.some(x=>isLeave(x.e))?`연차 ${uniqP(ents.filter(x=>isLeave(x.e))).length}명`:''].filter(Boolean).join(' · ')}</span></div>${S.readOnly?'':`<button type="button" class="btn primary" data-act="add-ev">${ic('plus',18)}일정 추가</button>`}</div>`+
      (S.loading?`<div class="empty">일정을 불러오는 중이에요…</div>`:ents.length?`<div class="evs">${grpRows(S.sel,ents,(x,c)=>entRow(x,{memo:true,cls:c}))}</div>`:`<div class="empty">이 날은 등록된 출장이 없어요</div>`)+tbdSection(monOf(S.sel),'이 주 날짜 미정');
  }else panel=`<div class="empty">날짜를 누르면 그날 일정과 일정 추가 버튼이 나와요</div>`;

    <div class="mnav"><button type="button" class="ib flat" data-act="month" data-n="-1" aria-label="이전 달">${ic('back')}</button><h1>${S.y}년 ${S.m+1}월</h1><button type="button" class="ib flat" data-act="month" data-n="1" aria-label="다음 달">${ic('next')}</button></div>

function matchQ(c,q){
  if(!q)return true;

}

/* ---------- 커피 사다리타기 (이 기기에서만 진행, 저장소에 안 남김) ---------- */
const LAD_MIN=2,LAD_MAX=12,LAD_ROWS=14;
/* 참가자: 이름 상자를 눌러 넣고 빼기. names = 고른 사람(직원 순서 → 직접 추가한 사람), extra = 직접 추가한 이름 */
function ladInit(){
  if(S.lad)return S.lad;
  let saved=null;try{saved=JSON.parse(store.get('hj.lad')||'null')}catch(e){}
  let names=saved&&Array.isArray(saved.sel)?saved.sel:saved&&saved.names?saved.names.slice(0,saved.n||saved.names.length):staff().map(p=>p.name);
  names=names.map(x=>String(x||'').trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).slice(0,LAD_MAX);
  const staffNames=staff().map(p=>p.name);
  const extra=((saved&&saved.extra)||names.filter(x=>!staffNames.includes(x))).filter(Boolean).slice(0,LAD_MAX);
  S.lad={names,extra,n:names.length,k:1,game:null,anim:null};
  S.lad.k=Math.min(Math.max(1,S.lad.n-1),Math.max(1,(saved&&saved.k)||1));
  return S.lad;
}
function ladPool(){const L=ladInit();const st=staff().map(p=>p.name);return st.concat(L.extra.filter(x=>!st.includes(x)))}
function ladSort(){const L=S.lad;const pool=ladPool();L.names=pool.filter(x=>L.names.includes(x)).slice(0,LAD_MAX);L.n=L.names.length;L.k=Math.min(Math.max(1,L.n-1),Math.max(1,L.k))}
function ladSave(){const L=S.lad;store.set('hj.lad',JSON.stringify({sel:L.names,extra:L.extra,k:L.k}))}
function ladName(i){const L=S.lad;return String(L.names[i]||'').trim()||('참가자 '+(i+1))}
/* 다시보기용 기록: 게임 중 뽑은 난수(r)와 프레임 시간(t, ms)을 기록(rec)하거나 그대로 다시 씀(play) */
let RP=null;
function frameDt(raw){
  if(RP&&RP.mode==='play'){const v=RP.t[RP.ti++];return v!=null?v/1000:raw}
  const q=Math.max(0,Math.round(raw*1000));if(RP&&RP.mode==='rec')RP.t.push(q);return q/1000;
}
function rnd(max){/* 0 이상 max 미만, 고른 난수 */
  if(RP&&RP.mode==='play'){const v=RP.r[RP.ri++];if(v!=null&&v>=0&&v<max)return v}
  const x=rnd0(max);if(RP&&RP.mode==='rec')RP.r.push(x);return x;
}
function rnd0(max){
  try{const a=new Uint32Array(1);const lim=Math.floor(4294967296/max)*max;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%max}catch(e){return Math.floor(Math.random()*max)}
}
function ladNew(){
  const L=S.lad,n=L.n;
  /* rung[r][g]=true 이면 r번째 줄에서 g열과 g+1열 사이에 가로줄 */
  const rung=[];
  for(let r=0;r<LAD_ROWS;r++){const row=[];for(let g=0;g<n-1;g++)row.push(!(g>0&&row[g-1])&&rnd(100)<38);rung.push(row)}
  for(let g=0;g<n-1;g++){
    if(rung.some(row=>row[g]))continue;
    const ok=[];for(let r=0;r<LAD_ROWS;r++)if(!(g>0&&rung[r][g-1])&&!(g<n-2&&rung[r][g+1]))ok.push(r);
    if(ok.length)rung[ok[rnd(ok.length)]][g]=true;
  }
  const slots=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){const j=rnd(i+1);[slots[i],slots[j]]=[slots[j],slots[i]]}
  const prize=Array(n).fill(false);slots.slice(0,L.k).forEach(i=>prize[i]=true);
  const names=[...Array(n).keys()].map(ladName);
  L.game={n,k:L.k,rung,prize,names,shown:[],all:false};
  L.anim=null;
}
function ladTrace(G,c){
  const pts=[[c,-1]];
  for(let r=0;r<LAD_ROWS;r++){
    if(G.rung[r][c]){pts.push([c,r]);c=c+1;pts.push([c,r])}
    else if(c>0&&G.rung[r][c-1]){pts.push([c,r]);c=c-1;pts.push([c,r])}
  }
  pts.push([c,LAD_ROWS]);
  return {pts,end:c};
}
function ladColor(G,i){const nm=G.names[i];const p=staff().find(x=>x.name===nm);return p?p.c:(PALETTE[i%PALETTE.length]||OTHER_C)}
function ladStepper(act,label,val,min,max){
  return `<div class="lstep"><span class="lab">${label}</span><div class="lctl">
    <button type="button" class="ib" data-act="${act}" data-n="-1" aria-label="${label} 줄이기" ${val<=min?'disabled':''}>${ic('minus',18)}</button>
    <b class="lval" aria-live="polite">${val}명</b>
    <button type="button" class="ib" data-act="${act}" data-n="1" aria-label="${label} 늘리기" ${val>=max?'disabled':''}>${ic('plus',18)}</button></div></div>`;
}
function vLadder(){
  const L=ladInit();
  if(!L.game)ladNew();
  const RG=L.game.replay;
  const head=`<div class="vh"><button type="button" class="ib flat" data-act="go" data-v="coffee" aria-label="커피내기로">${ic('back')}</button><div class="grow"><h1>사다리타기${RG?' 다시보기':''}</h1>${RG?`<span class="small muted">${cfWhen(RG)}${RG.by?` · ${esc(RG.by)} 진행`:''}</span>`:''}</div>${RG?'<span class="rp-badge">다시보기</span>':''}</div>`;
  const G=L.game,n=G.n;
  const avail=Math.min(isWide()?window.innerWidth-232-64:window.innerWidth-32,760)-34;
  const cw=Math.max(40,Math.min(110,Math.floor(avail/n)));
  const W=n*cw,rowH=26,top=10,H=top*2+rowH*(LAD_ROWS+1);
  const X=c=>c*cw+cw/2,Y=r=>r<0?0:r>=LAD_ROWS?H:top+rowH*(r+1);
  let svg=`<svg class="lad-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for(let c=0;c<n;c++)svg+=`<line x1="${X(c)}" y1="0" x2="${X(c)}" y2="${H}" class="lad-v"/>`;
  for(let r=0;r<LAD_ROWS;r++)for(let g=0;g<n-1;g++)if(G.rung[r][g])svg+=`<line x1="${X(g)}" y1="${Y(r)}" x2="${X(g+1)}" y2="${Y(r)}" class="lad-v"/>`;

function mountRoulette(st,ctl,ps,k){
  const size=Math.max(240,Math.min(st.clientWidth,400));
  st.innerHTML=`<canvas id="rwCanvas" aria-label="돌림판"></canvas>`;
  const cv=$('rwCanvas'),cx=setupCanvas(cv,size,size+18);
  let rem=ps.slice(),wins=[],ang=0,spinning=false,raf=0,alive=true,last=null;const spins=[];
  const P0=-Math.PI/2;
  function draw(){
    cx.clearRect(0,0,size,size+18);
    const R=size/2-6,C=[size/2,size/2+16],m=rem.length,seg=Math.PI*2/m;
    rem.forEach((p,j)=>{
      const c=pColor(p.nm,p.i),a0=ang+j*seg;
      cx.beginPath();cx.moveTo(C[0],C[1]);cx.arc(C[0],C[1],R,a0,a0+seg);cx.closePath();
      cx.fillStyle=c[0];cx.fill();cx.strokeStyle='#FFFFFF';cx.lineWidth=2;cx.stroke();
      cx.save();cx.translate(C[0],C[1]);cx.rotate(a0+seg/2);cx.fillStyle=c[1];
      cx.font=`700 ${m>8?13:15}px 'IBM Plex Sans KR',sans-serif`;cx.textAlign='right';cx.textBaseline='middle';
      cx.fillText(p.nm.length>6?p.nm.slice(0,6)+'…':p.nm,R-12,0);cx.restore();
    });
    cx.beginPath();cx.arc(C[0],C[1],22,0,Math.PI*2);cx.fillStyle='#FFFFFF';cx.fill();cx.strokeStyle='#16202E';cx.lineWidth=3;cx.stroke();
    cx.beginPath();cx.moveTo(C[0]-13,2);cx.lineTo(C[0]+13,2);cx.lineTo(C[0],30);cx.closePath();cx.fillStyle='#16202E';cx.fill();
  }
  function status(t){ctl.innerHTML=`<p class="gmsg">${t}</p><button type="button" class="btn primary gbig" id="rwSpin" ${spinning||rpPlay()?'disabled':''}>${wins.length?'다음 사람 뽑기':'돌리기'}</button>`;$('rwSpin').onclick=()=>spin();
    if(rpPlay()&&!spinning&&wins.length<k)rpLater(()=>spin(true),1100)}
  function spin(auto){

    const a0=ang,dur=reduceMotion()?600:4600,t0=performance.now();

}

function mountDraw(st,ctl,ps,k){
  const n=ps.length,deck=Array(n).fill(false);
  const slots=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=rnd(i+1);[slots[i],slots[j]]=[slots[j],slots[i]]}

  let turn=0;const picked={},wins=[],picks=[];let over=false;
  st.innerHTML=`<div class="cards" style="grid-template-columns:repeat(${n<=4?n:n<=9?3:4},minmax(0,1fr))">${deck.map((_,i)=>`<button type="button" class="dcard" id="dc-${i}" aria-label="${i+1}번 카드"><span class="back">${i+1}</span><span class="front"></span></button>`).join('')}</div>`;
  function status(){if(over)return;const p=ps[turn];const c=pColor(p.nm,p.i);ctl.innerHTML=`<p class="gmsg"><span class="pchip" style="--pc:${c[0]};--pt:${c[1]}">${esc(p.nm)}</span> 님 차례예요. 카드를 한 장 골라요.</p>`}
  const pick=i=>{const win=deck[i];
    if(over||picked[i]!=null)return;const p=ps[turn];picked[i]=p;const el=$('dc-'+i);
    el.querySelector('.front').innerHTML=`<b>${esc(p.nm)}</b>${win?`<span class="win">${ic('cup',18)}커피</span>`:'<span>통과</span>'}`;
    el.classList.add('open');if(win){el.classList.add('hit');wins.push(p.nm)}picks.push({nm:p.nm,card:i+1,win:!!win});
    turn++;
    if(wins.length>=k||turn>=n){over=true;ctl.innerHTML=`<p class="gmsg">커피 카드가 모두 나왔어요.</p>`;
      deck.forEach((w,j)=>{if(picked[j]==null){const e=$('dc-'+j);e.classList.add('open','rest');e.querySelector('.front').innerHTML=w?`<span class="win">${ic('cup',18)}커피</span>`:'<span>통과</span>'}});
      gameDone(wins,{picks})}
    else status();
  };
  deck.forEach((w,i)=>{$('dc-'+i).onclick=()=>{if(!rpPlay())pick(i)}});
  status();
  if(rpPlay()){const seq=((RP.rec.d&&RP.rec.d.picks)||[]).map(x=>x.card-1);let q=0;const nxt=()=>{if(over||q>=seq.length)return;pick(seq[q++]);rpLater(nxt,1100)};rpLater(nxt,1000)}
}

  renderNav();

  $('view').innerHTML=v==='cal'?vCal():v==='list'?vList():v==='contacts'?vContacts():v==='customer'?vCustomer():v==='req'?vReq():v==='menu'?vMenu():v==='ladder'?vLadder():v==='coffee'?vCoffee():v==='play'?vPlay():vToday();
  if(v==='play'){S.playDirty=false;requestAnimationFrame(mountGame)}

}

/* 장비별 작업 이력 */
function eqWorks(from,to,ppl){
  const out=[];
  S.events.forEach(e=>{if(isLeave(e)||!(e.units||[]).length)return;const st=e.start,en=e.end||e.start;if(!st||en<from||st>to)return;
    const who=splitP(e.person).filter(p=>!ppl.length||ppl.includes(p));if(!who.length)return;
    e.units.forEach(u=>out.push({e,u,who}))});
  return out.sort((a,b)=>String(a.e.start).localeCompare(String(b.e.start)));
}
function eqHistDownload(from,to,ppl){
  const W=eqWorks(from,to,ppl);
  const keyOf=r=>r.s?'s:'+eqKey(r.s):'h:'+eqKey(r.h);
  const map=new Map();S.equip.forEach(r=>{const k=keyOf(r);if(!map.has(k))map.set(k,{r,ws:[]})});
  W.forEach(w=>{let k=keyOf(w.u);if(!map.has(k)){const alt=w.u.s?null:[...map.values()].find(x=>eqKey(x.r.h)&&eqKey(x.r.h)===eqKey(w.u.h));if(alt)k=keyOf(alt.r);else map.set(k,{r:{c:w.u.c||'',m:w.u.m||'',l:w.u.l||'',p:w.u.p||'',s:w.u.s||'',h:w.u.h||''},ws:[],extra:true})}map.get(k).ws.push(w)});
  const dt=e=>isTbd(e)?`${e.start} 주(날짜 미정)`:(e.end&&e.end!==e.start?`${e.start}~${e.end}`:e.start);
  const wk=w=>w.u.w||w.e.work||'',mm=w=>[w.u.n,w.e.memo].filter(Boolean).join(' / ').replace(/\s*\n\s*/g,' / ');
  const line=w=>`${dt(w.e)} ${w.who.join(', ')}${wk(w)?' · '+wk(w):''}${mm(w)?' · 메모: '+mm(w):''}`;
  const h1=['회사명','담당자','장비 위치','Product','호기','S/N','작업 횟수','최근 작업일','작업 이력 (날짜 · 한 사람 · 작업내용 · 메모)','비고'];
  const r1=[...map.values()].map(x=>[x.r.c,x.r.m,x.r.l,x.r.p,x.r.h,x.r.s,x.ws.length,x.ws.length?x.ws[x.ws.length-1].e.start:'',x.ws.map(line).join('\n'),x.extra?'지금 장비 목록에 없는 장비 (일정에 적힌 정보)':'']);
  const h2=['시작일','요일','종료일','회사명','담당자','장비 위치','Product','호기','S/N','한 사람','방문 고객사/사이트','작업내용','메모'];
  const r2=W.map(w=>{const m=map.get(keyOf(w.u))||[...map.values()].find(x=>x.ws.includes(w))||{r:w.u};const r=m.r;
    return [w.e.start,WD[new Date(w.e.start+'T00:00:00').getDay()],w.e.end||w.e.start,r.c||w.u.c||'',r.m||w.u.m||'',r.l||w.u.l||'',r.p||w.u.p||'',w.u.h||r.h||'',w.u.s||r.s||'',w.who.join(', '),rptPlace(w.e),wk(w),mm(w)]});
  const blob=xlsxBook([{name:'장비별 이력',head:h1,rows:r1,widths:[16,10,16,12,14,14,9,12,70,18]},{name:'작업 목록',head:h2,rows:r2,widths:[12,6,12,16,10,16,12,14,14,12,20,36,30]}]);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hanbit_equipment_${from.replace(/-/g,'')}-${to.replace(/-/g,'')}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`장비별 작업 이력을 받았어요 (작업 ${W.length}건)`);
}
function openXlsx(){
  const mStart=(y,m)=>ymd(new Date(y,m,1)),mEnd=(y,m)=>ymd(new Date(y,m+1,0));
  const t=new Date();
  const st={mode:'month',from:mStart(S.y,S.m),to:mEnd(S.y,S.m),ppl:[]};
  const modes=[['month',`${S.m+1}월`],['year',`${t.getFullYear()}년`],['all','전체'],['custom','직접']];
  openSheet(`<div class="sb">
    <div class="f"><span class="lab">기간</span><div class="seg" role="group" aria-label="기간" id="xlMode">${modes.map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${k==='month'}">${l}</button>`).join('')}</div></div>
    <div class="rowline" id="xlCustom" hidden><div class="f" style="flex:1"><label for="xlFrom">시작</label><input type="date" id="xlFrom"></div><div class="f" style="flex:1"><label for="xlTo">끝</label><input type="date" id="xlTo"></div></div>
    <div class="f"><span class="lab">사람 (아무도 안 고르면 전체)</span><div class="picks" id="xlPpl"></div></div>
    <p class="small muted" id="xlInfo" style="margin:0"></p>
    <button type="button" class="btn primary" id="xlGo">${ic('down',18)}일정 엑셀 받기 (.xlsx)</button>
    <button type="button" class="btn" id="xlEq">${ic('down',18)}장비별 작업 이력 받기 (.xlsx)</button>
    <p class="small muted" id="xlEqInfo" style="margin:0"></p>
    <p class="small muted" style="margin:0">파일은 이 기기에서 바로 만들어지고 다른 곳으로 보내지지 않아요. 한 사람이 여러 명과 같이 간 일정은 사람마다 한 줄씩 나와요.</p>
  </div>`,'일정 엑셀로 받기','누가 · 언제 · 어디서 · 무슨 작업');
  const all=()=>{const ds=S.events.map(e=>e.start).filter(Boolean).sort();const de=S.events.map(e=>e.end||e.start).filter(Boolean).sort();return [ds[0]||ymd(t),de[de.length-1]||ymd(t)]};
  const draw=()=>{
    if(st.mode==='month'){st.from=mStart(S.y,S.m);st.to=mEnd(S.y,S.m)}
    else if(st.mode==='year'){st.from=`${t.getFullYear()}-01-01`;st.to=`${t.getFullYear()}-12-31`}
    else if(st.mode==='all'){[st.from,st.to]=all()}
    else{st.from=$('xlFrom').value||st.from;st.to=$('xlTo').value||st.to}
    $('xlCustom').hidden=st.mode!=='custom';$('xlFrom').value=st.from;$('xlTo').value=st.to;
    $('xlMode').querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===st.mode));
    $('xlPpl').innerHTML=people().map(n=>{const c=colorOf(n);return `<button type="button" class="pick pp" style="--pc:${c[0]};--pt:${c[1]}" data-p="${esc(n)}" aria-pressed="${st.ppl.includes(n)}">${esc(n)}</button>`}).join('');
    $('xlPpl').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=b.dataset.p;st.ppl=st.ppl.includes(n)?st.ppl.filter(x=>x!==n):[...st.ppl,n];draw()});
    const bad=st.from>st.to,n=bad?0:xlRows(st.from,st.to,st.ppl).length;
    $('xlInfo').textContent=bad?'시작이 끝보다 늦어요.':`${st.from.replace(/-/g,'.')} ~ ${st.to.replace(/-/g,'.')} · ${st.ppl.length?st.ppl.join(', '):'전체'} · ${n}줄`;
    $('xlGo').disabled=bad||!n;
    const hn=bad?0:eqWorks(st.from,st.to,st.ppl).length;
    $('xlEq').disabled=bad||(!S.equip.length&&!hn);
    $('xlEqInfo').textContent=S.equip.length?`장비 목록 ${S.equip.length}대 기준 · 이 기간 호기가 적힌 작업 ${hn}건`:'장비 목록이 아직 없어요. 메뉴 › 장비 목록에서 엑셀을 먼저 올려 주세요.'+(hn?` (호기가 적힌 작업 ${hn}건은 받을 수 있어요)`:'');
  };
  $('xlMode').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;draw()});
  $('xlFrom').onchange=$('xlTo').onchange=()=>{st.mode='custom';draw()};
  $('xlEq').onclick=()=>eqHistDownload(st.from,st.to,st.ppl);
  $('xlGo').onclick=()=>{
    const rows=xlRows(st.from,st.to,st.ppl);if(!rows.length)return;
    const blob=xlsxBlob('일정',XL_HEAD,rows,XL_W);
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`hanbit_schedule_${st.from.replace(/-/g,'')}-${st.to.replace(/-/g,'')}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast(`엑셀 파일을 받았어요 (${rows.length}줄)`);
  };
  draw();
}

    toast(useFull?'메일 앱을 열었어요':copied?'메일 앱을 열었어요. 내용은 복사해 뒀으니 본문에 붙여 넣으세요':'메일 앱을 열었어요. 내용 복사 버튼으로 복사해 붙여 넣으세요');
    const nt=$('rpNote');if(nt){nt.hidden=useFull;if(!useFull)nt.textContent=(copied?'내용이 길어서 메일 앱에는 받는 사람·제목만 넣었어요. 내용은 복사해 뒀으니 메일 본문을 한 번 누르고 붙여넣기(Ctrl+V) 하세요.':'내용이 길어서 메일 앱에는 받는 사람·제목만 넣었어요. 「내용 복사」를 누른 뒤 메일 본문에 붙여넣기(Ctrl+V) 하세요.')+(document.documentElement.classList.contains('phone')?'':' 내용까지 한 번에 넣으려면 「아웃룩 파일로 받기」를 쓰세요.')}
  };
  $('rpEml').onclick=()=>{
    const r=check();if(!r)return;const title=$('rpTitle').value,body=$('rpBody').value.replace(/\r?\n/g,'\r\n');
    const b64=t=>{const u=new TextEncoder().encode(t);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
    const wrap=t=>t.replace(/(.{76})/g,'$1\r\n');
    const eml=['To: '+r.to.join(', ')].concat(r.cc.length?['Cc: '+r.cc.join(', ')]:[]).concat([
      'Subject: =?UTF-8?B?'+b64(title)+'?=','X-Unsent: 1','MIME-Version: 1.0','Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64','',wrap(b64(body))]).join('\r\n');
    const blob=new Blob([eml],{type:'message/rfc822'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='meeting_'+dotD(st.mon).replace(/\./g,'')+'.eml';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('메일 파일을 받았어요. 열면 아웃룩에서 보낼 수 있어요');
  };
  draw();
}

/* ---------- schedule sheet ---------- */
function openEventSheet(ev,date){
  const isEdit=!!ev;
  const names=staff().map(p=>p.name);
  const given=ev?splitP(ev.person):[]; /* 새 일정은 담당자 선택 없이 시작 */
  const st={units:ev&&Array.isArray(ev.units)?ev.units.map(u=>({...u})):[],pl:ev?placesOf(ev).map(p=>({...p})):[],eq:ev?[...(ev.equipment||[])]:[],ppl:given.filter(n=>names.includes(n)),kind:ev&&isLeave(ev)?leaveOf(ev):'업무',
    tbd:!!(ev&&isTbd(ev)),mon:weekMon(parse(ev&&isTbd(ev)?ev.start:(date||todayStr())))};

      <div class="rpt-week" id="fWeek" hidden><button type="button" class="ib" id="fWkPrev" aria-label="이전 주">${ic('back')}</button><div class="txt"><b id="fWkTxt"></b><span class="small muted">날짜가 정해지면 이 일정을 열어 체크를 풀고 날짜를 고르세요</span></div><button type="button" class="ib" id="fWkNext" aria-label="다음 주">${ic('next')}</button></div></div>
    <div id="fWorkBox" class="fbox">
    <div class="f"><span class="lab">방문 고객사 (여러 곳 선택 가능, 누른 순서대로)</span><div class="picks" id="fCust"></div><div class="plist" id="fPlaces"></div></div>
    <div class="f"><label for="fContact">고객 담당자 (선택)</label><input id="fContact" placeholder="예: 장민준 — 미팅 안건 메일에 괄호로 들어가요" autocomplete="off" value="${esc(ev?ev.contact||'':'')}"></div>
    <div class="f"><label for="fUnit">호기 (선택 · 여러 대 가능)</label>
      <div class="ac"><div class="rowline ac-row"><input id="fUnit" placeholder="${S.equip.length?'예: ETH208 — 목록에서 찾거나 직접 입력':'호기 직접 입력 (장비 목록을 올리면 자동으로 찾아요)'}" autocomplete="off" autocapitalize="characters" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="fUnitList" style="flex:1;min-width:0"><button type="button" class="btn" id="fUnitAdd">넣기</button></div><div class="ac-list" id="fUnitList" role="listbox" hidden></div></div>
      <p class="small muted" style="margin:0">목록에 없는 호기도 쓰고 「넣기」를 누르면 들어가요. S/N은 직접 적을 수 있어요.</p>
      <div class="units" id="fUnits"></div></div>
    <div class="f"><label for="fWork">작업내용</label><input id="fWork" placeholder="예: 정기 교정 4대, 긴급 수리" autocomplete="off" value="${esc(ev&&!isLeave(ev)?ev.work||'':'')}"></div>
    </div>
    <div class="f" id="fLeaveQuick"><span class="lab">사유 (선택)</span><div class="picks"><button type="button" class="pick" id="fWhy" aria-pressed="false">개인 사유에 의한 연차</button></div></div>
    <div class="f"><label for="fMemo">메모</label><textarea id="fMemo" rows="3" placeholder="사유, 출입 신청, 준비물 등 자유롭게">${esc(ev?ev.memo||'':'')}</textarea></div>
    <div class="err" id="fErr"></div>
  </form>
  <footer>${isEdit?`<button type="button" class="btn danger" id="fDel">삭제</button>`:`<button type="button" class="btn" data-close>취소</button>`}<button type="button" class="btn primary grow" id="fSave">저장</button>${isEdit?delBox('이 일정을 지울까요? 모든 사람의 달력에서 사라지고 되돌릴 수 없어요.'):''}</footer>`,
  isEdit?'일정 수정':'일정 추가',isEdit?'':`누른 날짜 ${fmtDay(d)}부터 시작`);
  const syncPl=()=>{
    document.querySelectorAll('#fPlaces [data-si]').forEach(el=>{const p=st.pl[+el.dataset.si];if(p)p.site=el.value});
    document.querySelectorAll('#fPlaces [data-cn]').forEach(el=>{const p=st.pl[+el.dataset.cn];if(p)p.customerName=el.value});
  };
  const picks=()=>{
    $('fPeople').innerHTML=staff().map(p=>`<button type="button" class="pick pp" style="--pc:${p.c[0]};--pt:${p.c[1]}" data-p="${esc(p.name)}" aria-pressed="${st.ppl.includes(p.name)}">${esc(p.name)}</button>`).join('');
    $('fPeople').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const n=b.dataset.p;st.ppl=st.ppl.includes(n)?st.ppl.filter(x=>x!==n):[...st.ppl,n];picks()});
    $('fCust').innerHTML=CUSTOMERS.map(c=>`<button type="button" class="pick c-${c.cls}" data-c="${esc(c.key)}" aria-pressed="${st.pl.some(p=>p.customer===c.key)}">${esc(c.key)}</button>`).join('');
    $('fCust').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{syncPl();const k=b.dataset.c;
      if(st.pl.some(p=>p.customer===k))st.pl=st.pl.filter(p=>p.customer!==k);else st.pl.push({customer:k,customerName:'',site:''});picks()});
    $('fPlaces').innerHTML=st.pl.map((p,i)=>{const c=custOf(p.customer);
      const hints=c.sites.concat(sitesOf(p.customer)).filter((v,j,a)=>a.indexOf(v)===j);
      const cur=splitP(p.site);
      return `<div class="pbox c-${c.cls}">
        <div class="ph"><b class="cname">${st.pl.length>1?(i+1)+'. ':''}${esc(p.customer)}</b><button type="button" class="btn ghost sm" data-rm="${i}">빼기</button></div>
        ${p.customer==='기타'?`<input class="inp" data-cn="${i}" placeholder="고객사명 입력" autocomplete="off" value="${esc(p.customerName||'')}" aria-label="고객사명">`:''}
        <input class="inp" data-si="${i}" list="siteList" placeholder="사이트 (예: 화성 S3, 여러 곳은 쉼표)" autocomplete="off" value="${esc(p.site||'')}" aria-label="${esc(p.customer)} 사이트">
        ${hints.length?`<div class="picks">${hints.map(h=>`<button type="button" class="hint" data-i="${i}" data-s="${esc(h)}" aria-pressed="${cur.includes(h)}">${esc(h)}</button>`).join('')}</div>`:''}
      </div>`}).join('');
    $('fPlaces').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{syncPl();st.pl.splice(+b.dataset.rm,1);picks()});
    $('fPlaces').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{syncPl();const p=st.pl[+b.dataset.i];const cur=splitP(p.site);const h=b.dataset.s;
      p.site=(cur.includes(h)?cur.filter(x=>x!==h):[...cur,h]).join(', ');picks()});
    const used=[...new Set(S.events.flatMap(e=>placesOf(e).flatMap(p=>splitP(p.site))))];
    $('siteList').innerHTML=used.map(x=>`<option value="${esc(x)}">`).join('');
  };
  picks();
  /* 호기: 장비 목록에서 자동완성 → 고르면 S/N·Product·위치 표시 */
  const uKey=u=>eqKey(u.s)+'|'+eqKey(u.h);
  const unitsUI=()=>{$('fUnits').innerHTML=st.units.map((u,i)=>`<div class="unit"><div class="txt">
      ${u.free?`<span class="eq-l2"><b>${esc(u.h)}</b> <span class="small muted">직접 입력</span></span>
      <input class="inp sm" data-uf="s" data-ui="${i}" placeholder="S/N (선택)" autocomplete="off" value="${esc(u.s||'')}" aria-label="${esc(u.h)} S/N">`:eqDesc(u)}
      <input class="inp sm" data-uf="w" data-ui="${i}" placeholder="${esc(u.h)} 작업내용 (예: 정기 교정)" autocomplete="off" value="${esc(u.w||'')}" aria-label="${esc(u.h)} 작업내용">
      <input class="inp sm" data-uf="n" data-ui="${i}" placeholder="${esc(u.h)} 메모 (선택)" autocomplete="off" value="${esc(u.n||'')}" aria-label="${esc(u.h)} 메모">
      </div><button type="button" class="btn ghost sm" data-ur="${i}" aria-label="${esc(u.h)} 빼기">빼기</button></div>`).join('');
    $('fUnits').querySelectorAll('[data-ur]').forEach(b=>b.onclick=()=>{st.units.splice(+b.dataset.ur,1);unitsUI()});
    $('fUnits').querySelectorAll('[data-uf]').forEach(el=>el.oninput=()=>{const u=st.units[+el.dataset.ui];if(u)u[el.dataset.uf]=el.value.trim()})};
  let acHits=[];
  const acClose=()=>{const l=$('fUnitList'),i=$('fUnit');if(l)l.hidden=true;if(i)i.setAttribute('aria-expanded','false')};
  const acPick=u=>{if(!st.units.some(x=>uKey(x)===uKey(u)))st.units.push(u.free?{h:u.h,s:'',p:'',c:'',l:'',m:'',w:'',n:'',free:true}:{h:u.h||'',s:u.s||'',p:u.p||'',c:u.c||'',l:u.l||'',m:u.m||'',w:'',n:''});$('fUnit').value='';acClose();unitsUI();$('fUnit').focus()};
  const acDraw=()=>{const q=$('fUnit').value.trim();if(!q){acClose();return}
    syncPl();acHits=eqFind(q,st.pl.flatMap(p=>splitP(p.site)));
    const free=!acHits.some(r=>eqKey(r.h)===eqKey(q));
    $('fUnitList').innerHTML=acHits.map((r,i)=>`<button type="button" class="ac-opt" role="option" data-ai="${i}">${eqDesc(r)}</button>`).join('')
      +(free?`<button type="button" class="ac-opt free" role="option" data-af="1"><span class="small">${acHits.length?'':'장비 목록에 없어요 · '}「${esc(q)}」 그대로 넣기</span></button>`:'');
    $('fUnitList').hidden=false;$('fUnit').setAttribute('aria-expanded','true');
    $('fUnitList').querySelectorAll('[data-ai]').forEach(b=>b.onmousedown=b.onclick=ev2=>{ev2.preventDefault();acPick(acHits[+b.dataset.ai])});
    const fb=$('fUnitList').querySelector('[data-af]');if(fb)fb.onmousedown=fb.onclick=ev2=>{ev2.preventDefault();acPick({h:q.toUpperCase(),free:true})};
  };
  $('fUnit').addEventListener('input',acDraw);
  $('fUnit').addEventListener('keydown',ev2=>{if(ev2.key==='Enter'){ev2.preventDefault();ev2.stopPropagation();const q=$('fUnit').value.trim();if(!q)return;acPick(acHits[0]&&(eqKey(acHits[0].h).startsWith(eqKey(q))||acHits.length===1)?acHits[0]:{h:q.toUpperCase(),free:true})}else if(ev2.key==='Escape'){if(!$('fUnitList').hidden){ev2.stopPropagation();acClose()}}});
  $('fUnit').addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==$('fUnit'))acClose()},150));
  /* 「넣기」: 목록과 똑같은 호기가 있으면 그 장비, 없으면 쓴 그대로 */
  const addTyped=()=>{const q=$('fUnit').value.trim();if(!q)return false;const ex=S.equip.find(r=>eqKey(r.h)===eqKey(q));acPick(ex||{h:q.toUpperCase(),free:true});return true};
  $('fUnitAdd').onmousedown=ev2=>ev2.preventDefault();
  $('fUnitAdd').onclick=()=>{if(!addTyped())$('fUnit').focus()};
  unitsUI();
  const WHY='개인 사유에 의한 연차';
  const whyUI=()=>$('fWhy').setAttribute('aria-pressed',$('fMemo').value.includes(WHY));
  const tbdUI=()=>{const on=st.tbd&&st.kind==='업무';$('fTbd').setAttribute('aria-pressed',on);$('fDates').hidden=on;$('fWeek').hidden=!on;$('fTbdBox').hidden=st.kind!=='업무';
    $('fWkTxt').textContent=`${dotD(st.mon)} (월) ~ ${mdD(ymd(addD(st.mon,4)))} (금)`};
  $('fTbd').onclick=()=>{st.tbd=!st.tbd;tbdUI()};
  $('fWkPrev').onclick=()=>{st.mon=addD(st.mon,-7);tbdUI()};$('fWkNext').onclick=()=>{st.mon=addD(st.mon,7);tbdUI()};
  const kindUI=()=>{$('fKind').querySelectorAll('[data-k]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st.kind));$('fWorkBox').hidden=st.kind!=='업무';$('fLeaveQuick').hidden=st.kind==='업무';whyUI();tbdUI()};
  /* 연차 사유 빠른 선택: 누르면 메모에 "개인 사유에 의한 연차"가 들어가고, 다시 누르면 빠짐 (메모는 비워도 저장됨) */
  $('fWhy').onclick=()=>{const m=$('fMemo');const v=m.value;
    m.value=v.includes(WHY)?v.replace(WHY,'').replace(/^\s*·\s*|\s*·\s*$/g,'').trim():(v.trim()?WHY+' · '+v.trim():WHY);whyUI()};
  $('fMemo').addEventListener('input',whyUI);
  $('fKind').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{st.kind=b.dataset.k;kindUI()});kindUI();
  $('fStart').onchange=()=>{if($('fEnd').value<$('fStart').value)$('fEnd').value=$('fStart').value};
  $('evF').onsubmit=e=>{e.preventDefault();$('fSave').click()};
  $('fSave').onclick=async()=>{
    if($('fUnit')&&$('fUnit').value.trim()&&st.kind==='업무')addTyped();
    const ordered=staff().map(p=>p.name).filter(n=>st.ppl.includes(n)).concat(splitP($('fOther').value).filter(n=>!st.ppl.includes(n)));
    const tbd=st.tbd&&st.kind==='업무';
    const person=ordered.join(', '),start=tbd?ymd(st.mon):$('fStart').value,end=tbd?ymd(addD(st.mon,4)):($('fEnd').value||start);
    if(!person)return $('fErr').textContent='담당자를 한 명 이상 고르세요.';
    if(!start)return $('fErr').textContent='시작일을 고르세요.';
    if(end<start)return $('fErr').textContent='종료일이 시작일보다 빨라요.';
    const leave=st.kind!=='업무';
    if(!leave){syncPl();
    if(!st.pl.length)return $('fErr').textContent='방문할 고객사를 한 곳 이상 고르세요.';}
    if(!leave&&st.pl.some(p=>p.customer==='기타'&&!String(p.customerName||'').trim()))return $('fErr').textContent='기타 고객사의 이름을 입력하세요.';
    const places=leave?[]:st.pl.map(p=>({customer:p.customer,customerName:p.customer==='기타'?String(p.customerName||'').trim():'',site:splitP(p.site).join(', ')}));
    const now=new Date().toISOString();
    const data=leave?{person,start,end,kind:'leave',leaveType:st.kind,places:[],customer:'',customerName:'',site:'',equipment:[],units:[],tbd:false,contact:'',work:'',memo:$('fMemo').value.trim(),updatedAt:now,createdAt:ev?(ev.createdAt||now):now}
      :{person,start,end,kind:'work',leaveType:'',places,customer:places[0].customer,customerName:places[0].customerName,site:places[0].site,tbd,equipment:st.eq /* 장비 입력은 빠짐: 예전 일정의 장비 값은 그대로 둠 */,units:st.units.map(({free,...u})=>({...u,w:u.w||'',n:u.n||'',free:!!free})),contact:$('fContact').value.trim(),work:$('fWork').value.trim(),memo:$('fMemo').value.trim(),updatedAt:now,createdAt:ev?(ev.createdAt||now):now};
    $('fSave').disabled=true;
    try{
      if(isEdit)await dbSet('schedules',ev.id,data);else await dbAdd('schedules',data);
      /* 보고 있던 날짜가 이 일정 기간 안이면 그 날짜를 그대로 유지, 아니면 시작일로 이동 */
      const keep=S.sel&&S.sel>=start&&S.sel<=end;
      const sd=parse(keep?S.sel:start);S.sel=keep?S.sel:((sd.getDay()===0||sd.getDay()===6)?null:start);S.y=sd.getFullYear();S.m=sd.getMonth();
      closeSheet();render();toast(isEdit?'수정했어요':'저장했어요');
    }catch(err){$('fErr').textContent=failMsg(err);if($('fSave'))$('fSave').disabled=false}
  };
  if(isEdit){
    const box=$('sheet').querySelector('[data-confirm]');
    armDelete($('fDel'),box,async()=>{try{await dbDel('schedules',ev.id);closeSheet();render();toast('삭제했어요')}catch(err){$('fErr').textContent=failMsg(err)}});
  }
}

/* ---------- contact sheets ---------- */
function openContactSheet(c,preset){
  const isEdit=!!c;
  const st={kind:c?c.kind:(preset&&preset.kind)||'cust',cust:c?c.customer:(preset&&preset.cust)||'',role:c?c.role:'',area:c?c.area:'',models:c?[...(c.models||[])]:[]};

      <div class="f"><span class="lab">고객사</span><div class="picks" id="cCust"></div></div>
      <div class="f"><label for="cSite">사이트</label><input id="cSite" autocomplete="off" placeholder="예: 화성 S3" value="${esc(c?c.site||'':(preset&&preset.site)||'')}"><div class="picks" id="cSiteHints"></div></div>

    const areas=[...KEY_AREAS];if(st.area&&!areas.includes(st.area))areas.push(st.area);
    $('cArea').innerHTML=areas.map(r=>`<button type="button" class="pick" data-v="${esc(r)}" aria-pressed="${st.area===r}">${esc(r)}</button>`).join('');

    $('cModels').innerHTML=ms.map(m=>`<button type="button" class="pick mono" data-v="${esc(m)}" aria-pressed="${st.models.includes(m)}">${esc(m)}</button>`).join('');

    catch(err){$('cErr').textContent=failMsg(err);if($('cSave'))$('cSave').disabled=false}

/* ---------- actions ---------- */
const A={
  'go':t=>go(t.dataset.v),
  'go-ctab':t=>{S.ctab=t.dataset.v;S.cq='';go('contacts')},
  'pick-day':t=>{
    const k=t.dataset.d;const d=parse(k);
    if(S.view==='cal'&&isWide()){if(!S.readOnly)openEventSheet(null,k);return}
    S.sel=k;S.y=d.getFullYear();S.m=d.getMonth();

  'month':t=>shiftMonth(Number(t.dataset.n)),
  'cal-today':()=>{const d=new Date();S.y=d.getFullYear();S.m=d.getMonth();S.sel=(d.getDay()===0||d.getDay()===6)?null:ymd(d);render()},
  'f-person':t=>{S.fPerson=t.dataset.v===S.fPerson?'전체':t.dataset.v;store.set('hj.fp',S.fPerson);render()},
  'sp-add':()=>{S.staffDraft=(S.staffDraft||staff().map(p=>[p.name,p.rank])).concat([['','']]);render();const n=$('sp-n-'+(S.staffDraft.length-1));if(n)n.focus()},
  'sp-del':t=>{const i=Number(t.dataset.i);S.staffDraft=(S.staffDraft||staff().map(p=>[p.name,p.rank])).filter((_,j)=>j!==i);render()},
  'sp-up':t=>{const i=Number(t.dataset.i);if(i<1)return;const a=(S.staffDraft||staff().map(p=>[p.name,p.rank])).slice();[a[i-1],a[i]]=[a[i],a[i-1]];S.staffDraft=a;render()},
  'sp-cancel':()=>{S.staffDraft=null;render()},
  'sp-save':async()=>{
    const rows=(S.staffDraft||staff().map(p=>[p.name,p.rank])).map(r=>[String(r[0]).trim(),String(r[1]).trim()]).filter(r=>r[0]);
    if(!rows.length){toast('이름을 한 명 이상 적어 주세요');return}
    try{await saveSettings({people:rows.map(r=>({name:r[0],rank:r[1]}))});S.staffDraft=null;render();toast('저장했어요')}catch(err){toast(failMsg(err))}},
  'add-ev':()=>openEventSheet(null,S.sel||todayStr()),
  'edit-ev':t=>{const e=S.events.find(x=>x.id===t.dataset.id);if(e&&!S.readOnly)openEventSheet(e)},
  'ctab':t=>{S.ctab=t.dataset.v;S.cq='';const q=$('cq');if(q)q.value='';render()},
  'more-p':t=>{const k=t.dataset.k;if(OPENP.has(k))OPENP.delete(k);else OPENP.add(k);render()},
  'open-cust':t=>{S.custKey=t.dataset.k;S.site=null;go('customer')},
  'site':t=>{S.site=t.dataset.v;render()},
  'add-contact':t=>openContactSheet(null,{kind:t.dataset.kind||S.ctab,cust:t.dataset.cust||'',site:t.dataset.site||''}),
  'open-contact':t=>openContactDetail(t.dataset.id),
  'edit-main':t=>openMainSheet(t.dataset.k),
  'edit-visit':()=>openVisitSheet(),
  'add-site':()=>openSiteSheet(true),
  'edit-site':()=>openSiteSheet(false),
  'add-gate':()=>openGateSheet(null),
  'edit-gate':t=>openGateSheet(Number(t.dataset.i)),
  'req-cat':t=>{S.reqCat=t.dataset.v;render()},
  'req-filter':t=>{S.reqFilter=t.dataset.v;render()},
  'req-save':async t=>{const id=t.dataset.id;const r=S.requests.find(x=>x.id===id);if(!r)return;
    try{await dbSet('requests',id,{...stripId(r),status:$('rs-'+id).value,reply:$('rr-'+id).value.trim(),updatedAt:new Date().toISOString()});toast('저장했어요')}catch(err){toast(failMsg(err))}},
  'req-del':async t=>{
    if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='한 번 더 누르면 삭제';t.classList.add('solid');return}
    try{await dbDel('requests',t.dataset.id);toast('삭제했어요')}catch(err){toast(failMsg(err))}},
  'theme':t=>{S.theme=t.dataset.v;store.set('hj.theme',S.theme);applyTheme();render()},
  'lad-n':t=>{const L=ladInit();L.n=Math.min(LAD_MAX,Math.max(LAD_MIN,L.n+Number(t.dataset.n)));L.k=Math.min(L.k,L.n-1);ladSave();render()},
  'lad-k':t=>{const L=ladInit();L.k=Math.min(L.n-1,Math.max(1,L.k+Number(t.dataset.n)));ladSave();render()},
  'lad-fill':()=>{const L=ladInit();L.names=staff().map(p=>p.name).slice(0,LAD_MAX);ladSort();ladSave();render()},
  'lad-tog':t=>{const L=ladInit();const nm=t.dataset.nm;const isStaff=staff().some(p=>p.name===nm);
    if(L.names.includes(nm)){L.names=L.names.filter(x=>x!==nm);if(!isStaff)L.extra=L.extra.filter(x=>x!==nm)}
    else{if(L.names.length>=LAD_MAX){toast('최대 '+LAD_MAX+'명까지 참가할 수 있어요');return}L.names.push(nm)}
    ladSort();ladSave();render()},
  'report':()=>openReport(),
  'xlsx':()=>openXlsx(),
  'eq-up':()=>eqUpload(),
  'push-on':()=>pushOn(),
  'push-off':()=>pushOff(),
  'eq-reload':()=>{if(S.equipMeta)equipMetaIn(S.equipMeta,true)},
  'eq-clear':()=>{clearTimeout(S.eqAskT);if(!S.eqAsk){S.eqAsk=true;render();S.eqAskT=setTimeout(()=>{S.eqAsk=false;render()},4000);return}S.eqAsk=false;eqClear().then(()=>toast('장비 목록을 지웠어요')).catch(()=>toast('지우지 못했어요'))},
  'lad-every':()=>{const L=ladInit();const pool=ladPool();if(L.names.length===Math.min(pool.length,LAD_MAX)){L.names=[];L.extra=L.extra.filter(x=>staff().some(p=>p.name===x))}else L.names=pool.slice(0,LAD_MAX);ladSort();ladSave();render()},

  'g-again':()=>{mountGame();window.scrollTo(0,0)},
  'lad-run':t=>{const L=S.lad,G=L&&L.game;if(!G)return;const i=Number(t.dataset.i);if(!G.all&&!G.shown.includes(i))G.shown.push(i);L.anim=i;render();
    const ms=matchMedia('(prefers-reduced-motion:reduce)').matches?0:1500;clearTimeout(L.timer);L.timer=setTimeout(()=>{if(S.lad.anim===i){S.lad.anim=null;if(S.view==='ladder')render()}},ms)},
  'lad-all':()=>{const L=S.lad;if(!L||!L.game)return;L.game.all=true;L.anim=null;render()},
  'cf-open':t=>{const r=(S.coffee||[]).find(x=>String(x.at)===t.dataset.at);if(!r)return;openSheet(cfDetail(r),cfGameName(r.game)+' 진행 기록',cfWhen(r));const b=$('cfReplay');if(b)b.onclick=()=>{closeSheet();startReplay(r)}},
  'cf-lad-again':()=>{const G=S.lad&&S.lad.game;if(G&&G.replay)startReplay(G.replay)},
  'cf-del':t=>{const k=t.dataset.at;clearTimeout(S.cfAskT);
    if(S.cfAsk!==k){S.cfAsk=k;render();S.cfAskT=setTimeout(()=>{S.cfAsk=null;render()},4000);return}
    S.cfAsk=null;const gone=(S.coffee||[]).filter(r=>k==='all'||String(r.at)===k);if(db)gone.forEach(r=>{if(r.rp)db.doc('settings/cfr-'+r.at).delete().catch(()=>{})});
    const log=k==='all'?[]:(S.coffee||[]).filter(r=>String(r.at)!==k);S.coffee=log;render();toast(k==='all'?'결과를 모두 지웠어요':'결과를 지웠어요');
    if(db)db.doc('settings/coffee').set({log}).catch(()=>toast('지우지 못했어요'))},
  'save-me':()=>{S.me=$('meName').value.trim();store.set('hj.me',S.me);store.set('hj.meSet','1');toast(S.me?'저장했어요':'이름을 지웠어요');render()},
  'weather':()=>openWeather()
};

/* 페이지 나머지 코드가 쓰는 db 모양(collection().add/onSnapshot, doc().set/delete/onSnapshot)을 Firestore로 연결 */
async function connectFirebase(){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  const [A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG);
  const fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true});
  return {app,base,
    collection:name=>({
      add:data=>F.addDoc(F.collection(fs,name),data),
      onSnapshot:(next,err)=>F.onSnapshot(F.collection(fs,name),{includeMetadataChanges:true},next,err)
    }),
    doc:path=>({
      set:data=>F.setDoc(F.doc(fs,path),data),
      delete:()=>F.deleteDoc(F.doc(fs,path)),
      onSnapshot:(next,err)=>F.onSnapshot(F.doc(fs,path),next,err)
    })
  };
}

/* ---------- 새로고침해도 보던 화면 유지 (주소 # 뒤에 기록) ---------- */
const VIEWS=['today','cal','list','contacts','customer','req','menu','coffee','ladder','play'];
function saveLoc(){
  const q=new URLSearchParams();q.set('v',S.view);
  if(S.view==='cal'||S.view==='list'){q.set('ym',S.y+'-'+(S.m+1));if(S.sel&&S.view==='cal')q.set('d',S.sel)}
  if(S.view==='contacts')q.set('t',S.ctab);
  if(S.view==='customer'&&S.custKey){q.set('c',S.custKey);if(S.site)q.set('s',S.site)}
  const h='#'+q.toString();
  if(location.hash!==h){try{history.replaceState(history.state,'',location.pathname+location.search+h)}catch(e){}}
}
(function loadLoc(){
  try{
    const q=new URLSearchParams(location.hash.slice(1));const v=q.get('v');
    if(!VIEWS.includes(v))return;
    S.view=(v==='play'||v==='ladder')?'coffee':v;
    const ym=(q.get('ym')||'').split('-').map(Number);if(ym[0]&&ym[1]){S.y=ym[0];S.m=ym[1]-1}
    if(/^\d{4}-\d{2}-\d{2}$/.test(q.get('d')||''))S.sel=q.get('d');
    if(/^\d+$/.test(q.get('cf')||''))S.pendingCf=q.get('cf');
    if(['cust','hanbit','keysight'].includes(q.get('t')))S.ctab=q.get('t');
    if(v==='customer'){S.custKey=q.get('c');S.site=q.get('s');if(!S.custKey)S.view='contacts'}
  }catch(e){}
})();

/* ---------- 뒤로가기: 창 닫기 → 상위 화면 → '한 번 더 누르면 종료' ---------- */
/* 크롬은 사용자가 화면을 만진 뒤에 넣은 기록만 뒤로가기에 쓰므로, 터치할 때 '막이' 기록을 하나 넣어 둠 */
let needGuard=true,backArmed=0;
function pushGuard(){try{history.pushState({hjGuard:1},'',location.href)}catch(e){}needGuard=false}
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{if(needGuard)pushGuard()},true));
window.addEventListener('popstate',()=>{
  needGuard=true;
  if(!$('scrim').hidden){closeSheet();saveLoc();return}
  if(S.view==='customer'){go('contacts');return}
  if(S.view==='list'){go('cal');return}
  if(S.view==='ladder'||S.view==='play'){go('coffee');return}
  saveLoc();backArmed=Date.now();toast('한 번 더 누르면 종료돼요');
  setTimeout(()=>{if(backArmed&&Date.now()-backArmed>=1900)backArmed=0},2000);
});

render();
async function boot(){
  /* 관리자 표시: 주소 끝에 ?admin=1 로 한 번 열면 이 기기에 기억됨 (?admin=0 으로 해제). 로그인 붙이기 전 임시 방식 */
  try{const q=new URLSearchParams(location.search).get('admin');if(q==='1')store.set('hj.admin','1');if(q==='0')store.set('hj.admin','')}catch(e){}
  S.admin=store.get('hj.admin')==='1';
  try{db=await connectFirebase()}catch(e){db=null}
  if(!db){
    S.loading=false;S.readOnly=true;
    notice('저장소에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');
    render();return;
  }
  S.live=true;
  let timer=setTimeout(()=>notice('일정을 아직 불러오지 못했어요. 인터넷 연결을 확인하세요.'),10000);
  const onErr=err=>{clearTimeout(timer);S.loading=false;notice(err&&err.code==='permission-denied'?'데이터를 볼 권한이 없어요. 관리자에게 문의하세요.':'데이터를 불러오지 못했어요. 페이지를 새로고침해 주세요.');render()};
  const docs=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
  db.collection('schedules').onSnapshot(snap=>{S.events=docs(snap).map(normRec);S.loading=false;if(!snap.metadata.fromCache){clearTimeout(timer);notice('')}render()},onErr);
  db.collection('contacts').onSnapshot(snap=>{S.contacts=docs(snap).map(normRec);render()},onErr);
  db.collection('requests').onSnapshot(snap=>{S.requests=docs(snap);render()},onErr);
  db.collection('customers').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());S.customers=m;render()},onErr);
  db.doc('settings/org').onSnapshot(snap=>{S.settings=(snap&&snap.data&&snap.data())||{};render()},onErr);
  pushRefresh();
  db.doc('settings/equip').onSnapshot(snap=>{const d=(snap&&snap.data&&snap.data())||null;equipMetaIn(d)},()=>{});
  db.doc('settings/coffee').onSnapshot(snap=>{const d=(snap&&snap.data&&snap.data())||{};S.coffee=Array.isArray(d.log)?d.log:[];cfNotify();render();cfOpenPending()},()=>{});
}
boot();
})();
